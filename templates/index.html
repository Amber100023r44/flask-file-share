<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Drop</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      color: #00ffcc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #00ffcc;
    }
    form {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffcc88;
    }
    input[type="file"] {
      font-size: 1rem;
      color: #00ffcc;
      margin-bottom: 1rem;
    }
    input[type="submit"] {
      background: #00ffcc;
      color: #0f0f0f;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1.1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    a {
      margin-top: 1.5rem;
      display: inline-block;
      color: #00ffcc;
      text-decoration: none;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>File Drop</h1>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required><br>
    <input type="submit" value="Upload">
  </form>
  <a href="/files">📂 See All Files</a>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>TechDrop - Secure File Sharing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="main-grid">

    <div class="upload-box">
      <h1 class="title">Upload a File</h1>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" class="file-input">
        <button type="submit" class="upload-button">Upload</button>
      </form>
    </div>

    <div class="files-box">
      <h2 class="subtitle">Uploaded Files</h2>
      <p class="total-size">Total Used: {{ total_size }} MB</p>
      <ul class="file-list">
        {% for file in files %}
          <li>
            <a href="{{ url_for('uploaded_file', filename=file) }}" class="file-link">{{ file }}</a>
            <span class="dots"></span>
            <span class="file-size">
              {{ (os.path.getsize('uploads/' + file) / (1024*1024) ) | round(2) }} MB
            </span>
          </li>
        {% endfor %}
      </ul>
    </div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StreamBin 🗑️</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="main-container">
    <header>
      <h1>StreamBin 🗑️</h1>
      <p class="tagline">Secure. Simple. Seamless File Transfer.</p>
    </header>

    <section class="upload-box">
      <form method="POST" enctype="multipart/form-data">
        <label for="file-upload" class="custom-file-input">
          Select File
          <input type="file" id="file-upload" name="file" required>
        </label>
        <div id="file-name-display">No file selected</div>
        <button type="submit" class="upload-btn">Upload File</button>
      </form>
    </section>

    <footer>
      <p>&copy; 2025 StreamBin. Built with 🚀 and Flask.</p>
    </footer>
  </div>

  <script>
    const fileInput = document.getElementById('file-upload');
    const fileNameDisplay = document.getElementById('file-name-display');

    fileInput.addEventListener('change', () => {
      const fileName = fileInput.files[0]?.name || "No file selected";
      fileNameDisplay.textContent = fileName;
    });
  </script>
</body>
</html>

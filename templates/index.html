<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DropShare - File Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928DAB);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.01);
    }
    h1 {
      font-weight: 600;
      margin-bottom: 20px;
    }
    .upload-box {
      border: 2px dashed rgba(255, 255, 255, 0.4);
      padding: 40px;
      border-radius: 15px;
      background-color: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: border 0.3s, background-color 0.3s;
    }
    .upload-box.dragover {
      border: 2px solid white;
      background-color: rgba(255, 255, 255, 0.2);
    }
    input[type="file"] {
      display: none;
    }
    .submit-btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 16px;
      background-color: #ffffff22;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background-color: #ffffff44;
    }
    a {
      display: block;
      margin-top: 25px;
      color: #ffffffbb;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload Your Files</h1>
    <form id="uploadForm" method="POST" enctype="multipart/form-data" action="/upload">
      <label class="upload-box" id="drop-area">
        <span>📁 Drop files here or click to browse</span>
        <input type="file" name="file" id="fileElem" onchange="document.getElementById('uploadForm').submit();">
      </label>
      <button class="submit-btn" type="submit">Upload</button>
    </form>
    <a href="/files">🔽 View Uploaded Files</a>
  </div>

  <script>
    const dropArea = document.getElementById('drop-area');
    const fileElem = document.getElementById('fileElem');

    dropArea.addEventListener('click', () => fileElem.click());

    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.classList.add('dragover');
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.classList.remove('dragover');
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      fileElem.files = e.dataTransfer.files;
      document.getElementById('uploadForm').submit();
    });
  </script>
</body>
</html>

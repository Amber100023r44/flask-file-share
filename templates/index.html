<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechDrop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>TechDrop 🚀</h1>
            <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
                <input type="file" name="file" id="file">
                <button type="submit">Upload</button>
            </form>
        </header>

        <section class="file-list-section">
            <h2>Uploaded Files</h2>
            <p class="total-size">Total Used: {{ total_size }} MB</p>
            <ul class="file-list">
                {% for file in files %}
                <li>
                    <a href="{{ url_for('uploaded_file', filename=file.name) }}" download>{{ file.name }}</a>
                    <span class="dots"></span>
                    <span class="file-size">{{ file.size }} MB</span>
                </li>
                {% endfor %}
            </ul>
        </section>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🛰️ SecureDrop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>🛰️ SecureDrop</h1>
    <p>Drag and drop your files below, or click to upload.</p>
    
    <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" id="fileInput">
      <label for="fileInput" id="dropArea">📂 Drop files here or click to upload</label>
      <button type="submit">Upload</button>
    </form>

    <div class="file-list-link">
      <a href="/files">🔽 View Uploaded Files</a>
    </div>
  </div>

  <script>
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');

    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.classList.add('hover');
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.classList.remove('hover');
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      fileInput.files = e.dataTransfer.files;
      dropArea.classList.remove('hover');
    });

    dropArea.addEventListener('click', () => {
      fileInput.click();
    });
  </script>
</body>
</html>

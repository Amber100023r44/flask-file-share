<!DOCTYPE html>
<html>
<head>
  <title>STREAMBIN | Secure File Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="scanlines"></div>

  <header>
    <h1 class="logo">STREAMBIN<span class="glitch">_</span></h1>
    <p class="tagline">Encrypted Upload Node</p>
  </header>

  <main class="main-grid">
    <!-- Left: Upload -->
    <section class="upload-box">
      <h2>Upload a File</h2>
      <form method="POST" action="/" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">UPLOAD</button>
      </form>
    </section>

    <!-- Right: Uploaded Files -->
    <section class="uploaded-files">
      <h2>Uploaded Files</h2>
      <ul>
        {% for file in files %}
          <li><a href="{{ url_for('download', filename=file) }}" download>{{ file }}</a></li>
        {% endfor %}
      </ul>
    </section>
  </main>
</body>
</html>

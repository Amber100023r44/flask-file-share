<!DOCTYPE html>
<html>
<head>
  <title>TechDrop - Secure File Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>TechDrop 🚀</h1>

    <form method="POST" enctype="multipart/form-data" class="upload-form">
      <input type="file" name="file">
      <button type="submit">Upload</button>
    </form>

    <div class="file-list-section">
      <h2>Uploaded Files <span class="total-size">({{ total_size }} MB used)</span></h2>
      <ul class="file-list">
        {% for file in files %}
          <li>
            <a href="{{ url_for('uploaded_file', filename=file.name) }}" class="file-link">{{ file.name }}</a>
            <span class="dots"></span>
            <span class="file-size">{{ file.size }} MB</span>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</body>
</html>

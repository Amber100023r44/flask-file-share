<!DOCTYPE html>
<html>
<head>
  <title>TechDrop - Secure File Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>TechDrop 🚀</h1>

    <form class="upload-box" action="/upload" method="post" enctype="multipart/form-data">
      <label class="label-upload" for="file">📁 Drop or Choose Files</label>
      <input type="file" name="file" id="file" onchange="this.form.submit();">
    </form>

    <ul>
      {% for file in files %}
        <li><a href="{{ url_for('uploaded_file', filename=file) }}" download>{{ file }}</a></li>
      {% else %}
        <li>No files uploaded yet.</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
